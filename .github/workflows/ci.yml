name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Every text has a Serbian translation
        run: python3 tools/extract_keys.py

      - name: Restore
        run: dotnet restore IdentityToMvc.sln

      - name: Build
        run: dotnet build IdentityToMvc.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution IdentityToMvc.sln --no-build --configuration Release

      - name: Vulnerable packages
        run: |
          dotnet list IdentityToMvc.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE "\b(High|Critical)\b" vulnerable.txt; then
            echo "::error::A package with a high or critical vulnerability is referenced."
            exit 1
          fi
