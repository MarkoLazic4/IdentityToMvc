name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
#if (LangSr)

      - name: Every text has a Serbian translation
        run: python3 tools/extract_keys.py
#endif

      - name: Build
        run: dotnet build IdentityToMvc.sln --configuration Release
#if (Tests)

      - name: Test
        run: dotnet test --solution IdentityToMvc.sln --no-build --configuration Release
#endif
